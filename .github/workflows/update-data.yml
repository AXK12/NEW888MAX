name: 每日更新开奖数据 (23:15 CST)
on:
  schedule:
    - cron: '15 15 * * *'   # 每天 UTC 15:15 = 北京时间 23:15
                            # （原 22:15 太贴近大乐透 21:25 开奖、约 22:00-22:30 才出结果的时间，容易抓空）
  workflow_dispatch:         # 支持手动触发

permissions:
  contents: write

# 同一时刻只允许一个更新任务；手动连点两次也不会互相撞车
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 抓取最新开奖数据
        run: python fetch_data.py
      - name: 提交更新
        run: |
          git config user.name "lottery-bot"
          git config user.email "bot@axk12.github.io"
          git add data/
          if git diff --staged --quiet; then
            echo "没有新开奖数据，跳过提交"
            exit 0
          fi
          git commit -m "📊 自动更新开奖数据 $(date +'%Y-%m-%d')"
          # 与远端并发提交冲突时：data/*.json 是单行长文件，rebase 无法自动合并。
          # 增量合并下远端分支必然包含相同历史 + 可能更新的期号，因此以远端为准、丢弃本次提交，
          # 下一天的运行会把缺的期号补上（fetch_data.py 每次都按最新远端数据重新计算）。
          if ! git -c pull.rebase=true pull --rebase origin main; then
            git rebase --abort || true
            git reset --hard origin/main
            echo "⚠️ 与并发提交冲突，本次让位给远端（下次运行会自动补齐期号）"
            exit 0
          fi
          git push
